name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Verify tarball file list (gate)
        run: node scripts/check-pack.mjs
      # OIDC trusted publisher: frederick-wang/pi-openai-codex-usage + release.yml.
      # setup-node + registry-url is required; pnpm/setup alone yields ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public
