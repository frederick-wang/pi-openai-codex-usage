name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Verify tarball file list (gate)
        run: node scripts/check-pack.mjs
      # OIDC trusted publisher: frederick-wang/pi-openai-codex-usage + release.yml.
      # setup-node + registry-url is required; pnpm/setup alone yields ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # First published release uses the repo NPM_TOKEN secret (npm requires
      # a token for the first package version). Once the package exists, the
      # Trusted Publisher can be configured at https://www.npmjs.com/settings/
      # <account>/access_grants → 删除/清空 NPM_TOKEN secret 后，发布将自动
      # 走 OIDC trusted publishing（workflow 本身无需改动，publish 步骤两种
      # 模式共用）。
      - name: Publish (token now, OIDC once configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
